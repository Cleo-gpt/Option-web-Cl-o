<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chasse aux lumières</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Chasse aux lumières</h1>
  <p>Utilise les flèches ← et → pour avancer et reculer. Les lumières apparaissent dans ton dos et disparaissent après 5 secondes : sois rapide et récupère les 10 !</p>

  <div id="jeu">
    <div id="score">Lumières : 0 / 10</div>
    <div id="scene">
      <div id="personnage"></div>
    </div>
  </div>

  <div id="victoire" class="cachee">🎉 Bravo, tu as toutes les lumières ! 🎉</div>

  <script src="js/jeu.js"></script>
</body>
</html>
